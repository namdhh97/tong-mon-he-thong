services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: local_dev
      POSTGRES_DB: travel
    volumes:
      - travel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      DATABASE_URL: postgres://travel:local_dev@db:5432/travel
    depends_on:
      db:
        condition: service_healthy
volumes:
  travel_db: